name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel any in-flight run for the same ref — the only exception is `main`,
# where we always want the last commit to finish so we don't leave partial
# signal about post-merge health.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: Build + test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Build-time placeholders — the real values come from Amplify env
      # vars at deploy. These let `next build` complete its type-check
      # pass without attempting a network call against Supabase.
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-time-placeholder
      # Needed for the same reason, and its absence was failing the build
      # rather than skipping a fetch: /kiosk is a static route whose layout
      # calls getKioskUiConfig, which constructs the service-role client at
      # prerender time — and createClient throws "supabaseKey is required" on
      # an empty key before any request is made, so the export step aborts.
      # A placeholder is safe here: the URL above points nowhere, so the
      # client is built and then fails its fetch, which getKioskUiConfig
      # already handles by falling back to DEFAULT_KIOSK_UI_CONFIG. The real
      # key is a deploy-time secret and must never be a CI env var.
      SUPABASE_SERVICE_ROLE_KEY: build-time-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks wants history

      - uses: actions/setup-node@v4
        with:
          # 22+ required: Vitest 4 imports `styleText` from `node:util`,
          # which does not exist on Node 20/21 — the runner dies at startup
          # before a single test executes.
          node-version: 22
          cache: npm

      # Preserve Next's build cache between runs. Savings: 60-90 s / run
      # on a cold hit, ~2 min on warm cache. Key includes source-file
      # hashes so any code change invalidates cleanly; package-lock
      # invalidates on dep updates.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install
        run: npm ci

      - name: Lint (PII in logs)
        # Fail if someone writes `log.info({ email })` or similar — policy
        # is "log member IDs, never contact info". Pattern is intentionally
        # lenient on templating so `log.info("user email verified", { userId })`
        # still passes. Dedicated helpers (`log.error({ email: '[redacted]' })`)
        # use the explicit string `[redacted]` to signal intent.
        run: |
          set -e
          if git grep -nE 'log\.(debug|info|warn|error)\(.*\b(email|phone|phone_number|stripe_customer_id)\b\s*[:,]' -- 'src/**/*.ts' 'src/**/*.tsx' \
            | grep -iv "\[redacted\]" \
            | grep -vE ':[0-9]+:\s*(//|\*|/\*)' ; then
            echo "::error::PII in logger call — use memberId instead of email/phone. Use '[redacted]' literal if the field is already redacted."
            exit 1
          fi
          echo "✓ No PII in logger calls."

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Dependency audit (high severity only, warn)
        # Warn-only — a new high-severity finding in an npm dep shouldn't
        # block a PR that's unrelated. But surface it so the team sees it.
        run: npm audit --audit-level=high --omit=dev || echo "::warning::High-severity npm audit findings — triage separately."

      - name: Secret scanning (gitleaks)
        # Blocking — committing a secret is a production incident, not a
        # warning. `gitleaks` is fast; no config file means it uses its
        # default rule set which catches AWS keys, Stripe keys, Supabase
        # keys, GH tokens, etc.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # v2 requires a paid licence for repos owned by an organisation, and
          # it reads it from the environment — a repo secret alone is invisible
          # to the action unless it is passed in here. Without it the step exits
          # 1 before scanning anything, which is how this sat "failing" while
          # never actually having looked for a secret.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
